<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Paragraph Text</title>
</head>
<body>

<div id="myElement">
  <p id="message">Welcome to my website!</p>
</div>

<button onclick="changeText()">Click Me</button>

<script>
  function changeText() {
    document.getElementById("message").innerHTML = "Hello there!";
  }
</script>

</body>
</html>
